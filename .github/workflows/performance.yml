name: Performance Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run performance tests daily at 2 AM
    - cron: '0 2 * * *'

jobs:
  performance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run performance tests
      run: npm run test:performance

    - name: Check test execution time
      run: |
        echo "Validating test execution time..."
        START_TIME=$(date +%s)
        npm test
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "Test execution time: ${DURATION} seconds"
        
        # Fail if tests take longer than 5 minutes (300 seconds)
        if [ $DURATION -gt 300 ]; then
          echo "❌ Test execution time exceeded 5 minutes threshold"
          exit 1
        else
          echo "✅ Test execution time within acceptable limits"
        fi

    - name: Archive performance results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: |
          coverage/
          test-results.json